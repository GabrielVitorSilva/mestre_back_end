server.address=127.0.0.1
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/mestre}
spring.datasource.username=${DATABASE_USERNAME:mestre}
spring.datasource.password=${DATABASE_PASSWORD:mestre_local_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.default-schema=mestre
spring.flyway.schemas=mestre
spring.flyway.create-schemas=true

logging.level.org.flywaydb=INFO
logging.level.org.springframework.jdbc.datasource=INFO
