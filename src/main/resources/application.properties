server.address=127.0.0.1
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/mestre}
spring.datasource.username=${DATABASE_USERNAME:mestre}
spring.datasource.password=${DATABASE_PASSWORD:mestre_local_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.default-schema=mestre
spring.flyway.schemas=mestre
spring.flyway.create-schemas=true

logging.level.org.flywaydb=INFO
logging.level.org.springframework.jdbc.datasource=INFO

# PostgreSQL integrity errors can include row data. Never log their SQL/details.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
spring.mvc.log-request-details=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
